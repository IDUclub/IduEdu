name: Release

# Automated releases driven by Conventional Commits (python-semantic-release).
# Runs only in the official IDUclub/IduEdu repository, after Tests and Coverage
# succeeds for a push to main. The release commit may include [skip ci], so docs
# deployment is chained from this workflow instead of from push events.
#
# IduEdu ships a compiled Rust extension (iduedu._rust, PyO3 abi3), so the release
# builds one wheel per platform (valid for every supported CPython) plus the sdist.
#
# A manual run (workflow_dispatch) builds and publishes a release tag that already exists on main: for a
# release whose version commit and tag were made but whose automatic run stopped before publishing.

on:
  workflow_run:
    workflows: ["Tests and Coverage"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag on main to build and publish, e.g. v3.2.0"
        required: true
        type: string

# Do not run concurrent releases; let an in-flight release finish first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: >
      github.repository == 'IDUclub/IduEdu' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit + tag and create the GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released || steps.existing.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.existing.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history + tags are required to compute the next version

      - name: Ensure tested commit is still main
        if: github.event_name == 'workflow_run'
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Prepare historical release tags locally
        if: github.event_name == 'workflow_run'
        run: |
          git config --local push.followTags false
          python3 .github/scripts/normalize_release_tags.py \
            --repo . \
            --mapping .github/history-rewrite-tags.json \
            --apply-in-disposable-clone

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Use current stable Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install Python Semantic Release
        if: github.event_name == 'workflow_run'
        run: python -m pip install 'python-semantic-release==9.21.1'

      # Bumps pyproject.toml, rust/Cargo.toml, iduedu/_version.py and CITATION.cff, updates CHANGELOG.md,
      # commits, tags, builds the sdist (build_command) and creates the GitHub Release.
      - name: Python Semantic Release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          semantic-release version
          after="$(git rev-parse HEAD)"
          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            tag="$(git tag --points-at "$after" --list 'v*')"
            test -n "$tag"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      # Manual run: the tag must be on main and carry its own version; build its sdist and make the GitHub
      # Release from its CHANGELOG section unless it exists.
      - name: Existing release tag
        id: existing
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null
          git merge-base --is-ancestor "refs/tags/$TAG" HEAD
          git checkout -q "refs/tags/$TAG"
          version="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])
          PY
          )"
          test "v$version" = "$TAG"
          python -m pip install 'maturin>=1.9,<2.0'
          maturin sdist --out dist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^")"
            awk -v head="## $TAG " 'index($0, head) == 1 {on = 1; print; next} on && /^## v/ {exit} on {print}' \
              CHANGELOG.md > notes.md
            test -s notes.md
            url="https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            printf '\n---\n\n**Detailed Changes**: [%s...%s](%s)\n' "$previous" "$TAG" "$url" >> notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload source distribution
        if: steps.release.outputs.released == 'true' || steps.existing.outputs.released == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [version, wheels]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach distributions to the GitHub Release
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Attach distributions to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
