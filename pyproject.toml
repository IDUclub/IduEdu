[project]
name = "iduedu"
# kept in sync with rust/Cargo.toml, iduedu/_version.py and CITATION.cff by python-semantic-release
version = "3.0.0"
description = "IduEdu is a Python package for the creation and manipulation of complex city networks from OpenStreetMap and GTFS feeds."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
    { name = "DDonnyy", email = "63115678+DDonnyy@users.noreply.github.com" },
]
dependencies = [
    "geopandas>=1.1.0,<2.0.0",
    "loguru>=0.7.3,<0.8.0",
    "numpy>=2.0.0,<3.0.0; python_version < '3.14'",
    "numpy>=2.4.0,<3.0.0; python_version >= '3.14'",
    "pandas>=2.2.0,<4.0.0; python_version < '3.14'",
    "pandas>=3.0.0,<4.0.0; python_version >= '3.14'",
    "requests>=2.32.0,<3.0.0",
    "scipy>=1.16.0,<2.0.0; python_version < '3.14'",
    "scipy>=1.17.0,<2.0.0; python_version >= '3.14'",
    "tqdm>=4.67.0,<5.0.0",
]

[project.optional-dependencies]
elevation = [
    "rasterio>=1.4.0,<2.0.0",
]
io = [
    "pyarrow>=18.1.0,<26.0.0; python_version < '3.14'",
    "pyarrow>=22.0.0,<26.0.0; python_version >= '3.14'",
]

[dependency-groups]
dev = [
    { include-group = "docs" },
    { include-group = "lint" },
    { include-group = "notebooks" },
    { include-group = "release" },
    { include-group = "test" },
    { include-group = "viz" },
    "pre-commit>=4.3.0,<5.0.0",
    "pyarrow>=18.1.0,<26.0.0; python_version < '3.14'",
    "pyarrow>=22.0.0,<26.0.0; python_version >= '3.14'",
]
docs = [
    "furo>=2025.9.25,<2026.0.0",
    "myst-nb>=1.1.0,<2.0.0",
    "sphinx>=8.0.0,<9.0.0",
    "sphinx-autodoc-typehints>=3.2.0,<4.0.0",
    "sphinx-copybutton>=0.5.2,<0.6.0",
    "sphinx-design>=0.6.0,<0.7.0",
]
lint = [
    "black>=25.9.0,<26.0.0",
    "isort>=6.1.0,<7.0.0",
    "pylint>=3.3.5,<4.0.0",
]
notebooks = [
    "jupyter>=1.1.1,<2.0.0",
]
release = [
    "python-semantic-release>=9.15.0,<10.0.0",
]
test = [
    "networkx>=3.4.0,<4.0.0",
    "pytest>=8.3.5,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "rasterio>=1.4.0,<2.0.0",
]
viz = [
    "contextily>=1.6.2,<2.0.0",
    "folium>=0.19.5,<0.20.0",
    "mapclassify>=2.8.1,<3.0.0",
    "matplotlib>=3.10.1,<4.0.0",
]


[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

# The package is pure Python plus one compiled extension, iduedu._rust, built from rust/ (PyO3, abi3:
# one wheel per platform covers every supported Python version).
[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"
module-name = "iduedu._rust"
python-source = "."
python-packages = ["iduedu"]
features = ["pyo3/extension-module"]
exclude = [
    { path = "iduedu/**/__pycache__/**", format = "sdist" },
    { path = "iduedu/_rust*.so", format = "sdist" },
    { path = "iduedu/_rust*.pyd", format = "sdist" },
]

[tool.uv]
# rebuild the extension when the Rust sources change, not only when pyproject.toml does
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.pylint.format]
max-line-length = 120
expected-line-ending-format = "LF"
max-locals = 20
extension-pkg-allow-list = ["iduedu._rust", "networkit"]
disable = [
    "duplicate-code",
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "cyclic-import",
    "line-too-long",
    "too-many-return-statements",
    "too-many-positional-arguments"
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120
split_on_trailing_comma = true
skip = ["__init__.py"]

[tool.coverage.run]
branch = true
source = ["iduedu"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pragma: no branch",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p tests --cov-branch"
markers = [
    "unit: fast tests that do not touch network or external services",
    "integration: tests that exercise several package layers together",
    "network: tests that may call Overpass or depend on cached downloaded data",
    "slow: tests that are slow enough to be excluded from tight feedback loops",
    "rust: tests that exercise the Rust kernels directly",
]

# ---------------------------------------------------------------------------
# Automated releases (python-semantic-release)
#
# The next version is derived from Conventional Commit messages since the last
# tag: feat -> minor, fix/perf -> patch, feat!/BREAKING CHANGE -> major.
# In the official repository, the release workflow runs after Tests and Coverage
# succeeds on main, bumps the version in pyproject.toml, rust/Cargo.toml,
# iduedu/_version.py and CITATION.cff, updates CHANGELOG.md, commits, tags vX.Y.Z,
# builds the sdist and the abi3 wheels, and publishes. See CONTRIBUTING.md.
# ---------------------------------------------------------------------------
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version", "rust/Cargo.toml:package.version"]
version_variables = ["iduedu/_version.py:VERSION", "CITATION.cff:version"]
tag_format = "v{version}"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomated release, see CHANGELOG.md."
build_command = "python -m pip install 'maturin>=1.9,<2.0' && maturin sdist --out dist"
allow_zero_version = false
major_on_zero = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# Conventional-commit types that trigger a version bump. Everything else
# (docs, test, chore, refactor, ci, style, build) leaves the version untouched.
allowed_tags = [
    "feat",
    "fix",
    "perf",
    "build",
    "chore",
    "ci",
    "docs",
    "refactor",
    "style",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['''^chore\(release\):.*''']
